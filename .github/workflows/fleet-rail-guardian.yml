name: fleet-rail-guardian
# Storm-proof rail guardian (wave 19.91, trace 1a16f14ff7c8dded).
# Measured reality: the fleet-economy receipts rail survives <1 min under the push-reviver
# ours-merge storm, and a dead workflow cannot self-rescue. This guardian lives on the
# surviving plane (giant's scheduled infra) and re-arms the fleet-economy rail from the
# canonical blobs stored in sovereign/rail-canonical/ using the owner-delegated
# FLEET_RAIL_PAT secret (libsodium-sealed; same custody pattern as FLEET_ROSTER_MAP, 19.51).
# Law: absent-or-divergent => re-PUT; re-PUT denied => LOUD warning, run stays green (no red-spam);
# guardian's own bugs => exit 2 fail-closed.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: fleet-rail-guardian
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical blobs
        uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Restore fleet-economy receipts rail from canonical blobs
        env:
          GH_TOKEN: ${{ secrets.FLEET_RAIL_PAT }}
          RAIL_REPO: roshpinacare-sys/fleet-economy
        run: |
          set -uo pipefail
          declare -A MAP=(
            ["lib/receipt-sign.ts"]="sovereign/rail-canonical/lib_receipt-sign.ts.b64"
            ["tests/receipt-sign.test.ts"]="sovereign/rail-canonical/tests_receipt-sign.test.ts.b64"
            ["scripts/fleet-receipts-guard-core.py"]="sovereign/rail-canonical/scripts_fleet-receipts-guard-core.py.b64"
            [".github/workflows/receipts-guard.yml"]="sovereign/rail-canonical/.github_workflows_receipts-guard.yml.b64"
            ["state/audit/verify_signatures.py"]="sovereign/rail-canonical/state_audit_verify_signatures.py.b64"
            [".github/workflows/receipts-proof.yml"]="sovereign/rail-canonical/.github_workflows_receipts-proof.yml.b64"
          )
          REARMED=0; ALERTS=""; DENIED=0; INTACT=0
          [ -z "${GH_TOKEN:-}" ] && echo "::warning::FLEET_RAIL_PAT absent — DETECTION-ONLY mode (re-arm needs the owner-delegated secret)"
          for path in "${!MAP[@]}"; do
            b64f="${MAP[$path]}"
            [ -f "$b64f" ] || { echo "::error::canonical blob missing: $b64f"; exit 2; }
            local_sha=$(base64 -d "$b64f" | sha256sum | cut -d' ' -f1)
            http=$(curl -s -o /tmp/blob.json -w "%{http_code}" ${GH_TOKEN:+-H "Authorization: Bearer $GH_TOKEN"} \
              "https://api.github.com/repos/$RAIL_REPO/contents/$path")
            if [ "$http" = "404" ]; then
              echo "::notice::rail path ABSENT on cloud: $path — re-PUT from canonical"
              if [ -n "${GH_TOKEN:-}" ]; then
                # גל-80 ריפוי (trace 1a173c3929f5d23d §2): ה-blob הקנוני הוא כבר base64(קובץ-אמת) —
                # נשלח כמו-שהוא. היה base64 -w0 של-ה-blob (קידוד-כפול) ⇒ בענן נחת base64-טקסט
                # במקום הקובץ-האמת (נמדד: lib/receipt-sign.ts 'Lyog…' 10776B = 4/3 × 8081B) —
                # הרכבת-הקבלות מעולם לא הייתה ריצה-אמיתית בענן. מעתה: בתים-אמיתיים בדיוק.
                put=$(curl -s -o /tmp/put.json -w "%{http_code}" -X PUT -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/$RAIL_REPO/contents/$path" \
                  -d "{\"message\":\"guardian: rail re-PUT $path (absent — ours-merge storm erasure; canonical lineage 1969771/a618f33 + wave-80 encoding cure)\",\"content\":\"$(tr -d '\n' < "$b64f")\"}")
                case "$put" in
                  200|201) REARMED=$((REARMED+1)); echo "re-armed: $path (HTTP $put)" ;;
                  401|403) DENIED=$((DENIED+1)); echo "::warning::re-PUT DENIED ($put) for $path — cross-repo write custody gap named, never hidden" ;;
                  *) DENIED=$((DENIED+1)); echo "::warning::re-PUT unexpected ($put) for $path — named loudly" ;;
                esac
              else
                DENIED=$((DENIED+1)); ALERTS="$ALERTS ABSENT:$path"
              fi
            elif [ "$http" = "200" ]; then
              remote_sha=$(python3 -c "import json,base64,hashlib;d=json.load(open('/tmp/blob.json'));print(hashlib.sha256(base64.b64decode(d['content'])).hexdigest())")
              if [ "$remote_sha" != "$local_sha" ]; then
                echo "::warning::rail path DIVERGENT on cloud: $path (remote $remote_sha != canonical $local_sha) — ALERT ONLY (rewrite class, never fight)"
                ALERTS="$ALERTS DIVERGENT:$path"
              else
                INTACT=$((INTACT+1)); echo "rail path INTACT: $path"
              fi
            else
              echo "::warning::unexpected API status $http for $path (named loudly, run continues)"
              ALERTS="$ALERTS HTTP$http:$path"
            fi
            sleep 1
          done
          {
            echo "### fleet-rail-guardian receipt"
            echo "- re-armed: $REARMED / 6"
            echo "- intact: $INTACT / 6"
            echo "- denied-or-absent-no-secret: $DENIED"
            echo "- alerts: ${ALERTS:-none}"
            echo "- canonical lineage: 1969771/a618f33 + wave-80 (byte-TRUE, suite 14/14, encoding-cured, dotfile blob restored)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "GUARDIAN RECEIPT: re-armed=$REARMED intact=$INTACT denied=$DENIED alerts=[${ALERTS:-none}]"
          exit 0
