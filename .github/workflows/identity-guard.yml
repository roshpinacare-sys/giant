# IDENTITY-GUARD — DECISIONS #10 enforcement (keyless, fail-loud)
#
# [ADOPTED to giant · wave 19.76 · trace 1a1643b867ee25e1] measured 2026-10-22:
# 13 of giant's last 15 commits carry the container-default identity z@container
# (voice-ops seal, vault-seal [auto-economy], worklog lanes) while the identity
# law v3 covered only the five core repos — the estate's newest law had no
# jurisdiction here, so the writes landed SILENT. This adoption gives the law
# its giant jurisdiction; the tears it will raise on the container writers are
# the law working as designed (enforcement names, adoption happens at the
# writers — DECISIONS #29 class, owner-side for history).
#
# Law: no commit may carry NAME@users.noreply.github.com as author OR
# committer, except the owner identities and github-actions[bot] — and no
# commit may carry *@container (the sandbox default identity class, e.g.
# "Z User <z@container>"): the lane law requires <lane>@fleet.local, and a
# container-default commit is an UNIDENTIFIED lane. [wave 19.62 · trace
# 1a16145d1d245e5d] measured live on Domain: a sibling sandbox landed d4547bb
# as "Z User <z@container>" @01:45:50Z and the guard passed it — the encoded
# law lagged the lane law; this clause closes that gap.
#
# [wave 19.64 · trace 1a161b5c5db3c7f9] v3 DENY-BY-DEFAULT: the allowlist IS
# the lane law. ONLY <lane>@fleet.local, <lane>@agents.roshpinacare-sys, the
# owner org identities (326012154+roshpinacare-sys@ and roshpinacare-sys@
# users.noreply), github-actions[bot] (both noreply forms), actions@github.com
# and roshpinacare@gmail.com may author or commit. Anything else is an
# unidentified writer — torn loudly on push, counted weekly by the census.
#
# [wave 19.75 · trace 1a1640ccab18fd91] gawk -v ESCAPE-MANGLING cure: the raw
# allowlist regex passes through the ENVIRONMENT (ENVIRON["ALLOWED"]) — no -v
# escape processing, so \+ \. \[ reach the ERE engine as literals. Measured on
# runner logs: the -v form stripped the escapes and false-flagged ~73 lawful
# owner-noreply commits in the first-ever executed scheduled sweep.

name: identity-guard

on:
  push:
  workflow_dispatch:         # manual activation of the deep sweep (run-ID proof on demand)
  schedule:
    - cron: '33 6 * * 1'   # weekly Monday deep sweep (report-only custody receipt)
    - cron: '11 9 * * *'   # daily silence-sweep 09:11Z — the unsilenceable channel against skip-CI-marker pushes (wave 19.69)
    - cron: '17 12 * * *'  # daily silence-sweep HEDGE 12:17Z — second chance when GitHub sheds the primary slot (measured 2026-10-22, wave 19.71: zero first-day schedule slots fired across five active guard repos while other workflows' schedules ran)

permissions:
  contents: read

concurrency:
  group: identity-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    if: github.event_name == 'push'   # the guard scans the PUSHED range only — on schedule/dispatch the census pair (silence-sweep + deep-sweep) speaks instead (wave 19.71: the dispatch fallback HEAD~40..HEAD tore on historical debt with false pushed-commits semantics)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout full history (needed for push-range resolution)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan pushed commits for unlawful identities (author + committer)
        shell: bash
        run: |
          set -euo pipefail
          # identity law v3 — deny-by-default (wave 19.64): the allowlist IS the
          # lane law. Enumerated classes (noreply, container) were approximations;
          # every sandbox default (z@user.local, @zai.local, @saos.local,
          # @sovereign-fleet, @agents.noreply.github.com, ...) now falls to the
          # same single rule: no allowlist match = violation.
          ALLOWED='^([0-9]+\+roshpinacare-sys@users\.noreply\.github\.com|roshpinacare-sys@users\.noreply\.github\.com|([0-9]+\+)?github-actions\[bot\]@users\.noreply\.github\.com|[^@]+@fleet\.local|[^@]+@agents\.roshpinacare-sys|roshpinacare@gmail\.com|actions@github\.com)$'
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="HEAD~40..HEAD"
          else
            RANGE="$BEFORE..$AFTER"
          fi
          echo "identity-guard: scanning $RANGE (law v3 deny-by-default)"
          VIOLATIONS="$(git log --pretty='%H|%ae|%ce|%s' "$RANGE" 2>/dev/null | ALLOWED="$ALLOWED" awk -F'|' '
            $2 !~ ENVIRON["ALLOWED"] || $3 !~ ENVIRON["ALLOWED"]
          ' || true)"
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::DECISIONS #10 VIOLATION — unlawful identities in pushed commits (identity law v3 deny-by-default: only <lane>@fleet.local, <lane>@agents.roshpinacare-sys, the owner org identities, github-actions[bot], actions@github.com and roshpinacare@gmail.com are lawful; anything else is an unidentified sandbox writer)"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "identity-guard: PASS — 0 unlawful identities in $RANGE"

  deep-sweep:
    if: (github.event_name == 'schedule' && github.event.schedule == '33 6 * * 1') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Full-history identity census (REPORT-ONLY custody receipt)
        run: |
          set -euo pipefail
          # Same law as the push guard, but the whole history: count + name every
          # forbidden-identity commit. This job NEVER fails on findings (report-only,
          # org-gitleaks T-w class) — the wound stays registered and counted; only a
          # scan error fails.
          # identity law v3 — deny-by-default: same allowlist as the push scan.
          ALLOWED='^([0-9]+\+roshpinacare-sys@users\.noreply\.github\.com|roshpinacare-sys@users\.noreply\.github\.com|([0-9]+\+)?github-actions\[bot\]@users\.noreply\.github\.com|[^@]+@fleet\.local|[^@]+@agents\.roshpinacare-sys|roshpinacare@gmail\.com|actions@github\.com)$'
          VIOLATIONS="$(git log --pretty='%H|%ae|%ce|%ad|%s' --date=iso origin/main 2>/dev/null | ALLOWED="$ALLOWED" awk -F'|' '
            $2 !~ ENVIRON["ALLOWED"] || $3 !~ ENVIRON["ALLOWED"]
          ' || true)"
          COUNT="$(printf '%s' "$VIOLATIONS" | grep -c . || true)"
          echo "identity-guard deep-sweep: FULL-HISTORY census — ${COUNT} forbidden-identity commits on record"
          [ -n "$VIOLATIONS" ] && printf '%s\n' "$VIOLATIONS" || true
          mkdir -p receipts/identity-guard
          python3 - "$COUNT" receipts/identity-guard/deep-sweep.json << 'PYEOF'
          import json, sys, datetime
          count = int(sys.argv[1])
          receipt = {
              "schema": "identity-guard/deep-sweep/1",
              "law": "deny-by-default/1 (wave 19.64)",
              "at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "mode": "report-only",
              "forbiddenIdentityCommits": count,
              "allowedClasses": ["*@fleet.local", "*@agents.roshpinacare-sys", "326012154+roshpinacare-sys@users.noreply.github.com", "roshpinacare-sys@users.noreply.github.com", "github-actions[bot]@users.noreply.github.com", "actions@github.com", "roshpinacare@gmail.com"],
              "note": "landed violations never re-tear on push ranges; this weekly receipt keeps the count loud; history rewrite = owner-side (DECISIONS #29)",
          }
          with open(sys.argv[2], "w") as fh:
              json.dump(receipt, fh, indent=1)
          PYEOF

      - name: Commit receipt (house pull-rebase-retry law)
        run: |
          set -euo pipefail
          git config user.name "identity-guard[bot]"
          git config user.email "identity-guard[bot]@fleet.local"
          git add receipts/identity-guard/deep-sweep.json
          if git diff --cached --quiet; then
            echo "receipt unchanged — honest no-op"
            exit 0
          fi
          git commit -m "identity-guard deep-sweep: weekly full-history identity custody receipt [skip ci]"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main; then
              if git push; then ok=1; break; fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "publish race $i — backing off"
            sleep $((i * 7))
          done
          [ "$ok" = "1" ] || echo "publish-deferred (sibling races) — the next weekly slot re-measures honestly"

  silence-sweep:
    # [wave 19.69 · trace 1a162c0c84652ef5] THE SILENCE HOLE, measured: a push whose
    # HEAD commit message carries the CI-skip marker silences EVERY push-triggered
    # workflow — landed violations never re-tear on push ranges, so a wound could
    # sleep until the weekly REPORT-ONLY deep sweep. This job runs on schedule —
    # the one trigger the skip marker cannot silence — and tears loudly on any
    # unlawful identity landed in the last 26h: the silence window collapses from
    # up to 7 days to at most 26h. It is enforcement (fails the run), not report:
    # the deny-by-default law now has an unsilenceable channel. Dispatchable for
    # run-ID proof on demand.
    if: (github.event_name == 'schedule' && github.event.schedule == '11 9 * * *') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Recent-window identity enforcement (last 26h, unsilenceable)
        shell: bash
        run: |
          set -euo pipefail
          # Same law text as the push guard (v3 deny-by-default), same allowlist.
          # Window is recent-only: old wounds belong to the weekly report-only
          # deep sweep and to owner-side history rewrite (DECISIONS #29).
          ALLOWED='^([0-9]+\+roshpinacare-sys@users\.noreply\.github\.com|roshpinacare-sys@users\.noreply\.github\.com|([0-9]+\+)?github-actions\[bot\]@users\.noreply\.github\.com|[^@]+@fleet\.local|[^@]+@agents\.roshpinacare-sys|roshpinacare@gmail\.com|actions@github\.com)$'
          VIOLATIONS="$(git log --pretty='%H|%ae|%ce|%ad|%s' --date=iso --since='26 hours ago' origin/main 2>/dev/null | ALLOWED="$ALLOWED" awk -F'|' '
            $2 !~ ENVIRON["ALLOWED"] || $3 !~ ENVIRON["ALLOWED"]
          ' || true)"
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::IDENTITY LAW VIOLATION LANDED SILENTLY — the skip-CI marker silenced the push guard, but this scheduled sweep is unsilenceable; unlawful identities on main in the last 26h (identity law v3 deny-by-default: only <lane>@fleet.local, <lane>@agents.roshpinacare-sys, the owner org identities, github-actions[bot], actions@github.com and roshpinacare@gmail.com are lawful)"
            printf '%s\n' "$VIOLATIONS"
            exit 1
          fi
          echo "identity-guard silence-sweep: PASS — 0 unlawful identities landed in the last 26h"
