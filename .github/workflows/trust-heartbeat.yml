name: trust-heartbeat

# ═══ פעימת-האמון-האוטונומית (גל-8) ═══════════════════════════════════════
# חוק-הבעלים: "אתם סנדבוקסים-שנמחקים — לא בונים עליכם. תנו לאוטונומיה לעבוד."
# הסריקה-המדודה של כל-ספרי-האימפריה רצה כאן — על-השרשרת של הגיט, אפס-סנדבוקס.
# התוצר: db/trust-cache.json נדחף-חזרה ע"י github-actions[bot] — הממשק-החי
# זורע-מהקנון-הזה (seedFromGitCanon) והאמון-מתעדכן-לבד-כל-שעתיים.
# FLEET_PAT = PAT-מלא-של-הבעלים (סוד-ריפו) — בלעדיו-ה-Search-API-רואה-רק-14/39.

on:
  schedule:
    - cron: "0 */2 * * *"   # כל-שעתיים (UTC) — זרימה-כפולה על דקות-ציבור חינם (ההשקה 15.10)
  workflow_dispatch: {}      # הפעלה-ידנית-אוטונומית

permissions:
  contents: write

concurrency:
  group: trust-heartbeat
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: סריקת-אמון-על-כל-הספרים (עצי-גיט בלבד — אפס-ריצת-קוד)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLEET_PAT: ${{ secrets.FLEET_PAT }}
        run: node scripts/trust-heartbeat.mjs

      - name: דחיפת-הקנון-המעודכן
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # db/ מנוטרל-ב-gitignore (מטמוני-ריצה-מקומיים) — הקנון-האוטונומי נדחף-בכוח-מוצהר
          git add -f db/trust-cache.json
          if git diff --cached --quiet; then
            echo "אין-שינויים-מדודים — אין-קומיט"
          else
            # FIX(2026-10-19 · heartbeat push-races): הקנון-נדחף-גם-ע"י-הבוטים-החיים —
            # מירוץ-בודד-הפיל-את-הפעימה (02:30Z). לולאת-חוסן: 5-ניסיונות rebase+push,
            # 10ש׳-ביניהם. התוצר-נוצר-מחדש-כל-פעימה — כל-צד-במירוץ-הוא-אמת-טרייה.
            OK=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git commit -m "trust-heartbeat: autonomous scan (no-sandbox) — $(date -u +'%Y-%m-%dT%H:%MZ')" && git push origin HEAD:main; then OK=1; break; fi
              echo "ניסיון-${i} נכשל (מירוץ-דחיפה) — ממתין-10ש׳"
              sleep 10
              git rebase --abort 2>/dev/null || true
              git add -f db/trust-cache.json || true
            done
            if [ "${OK}" != "1" ]; then
              echo "##[error] הקנון-לא-נדחף-אחרי-5-ניסיונות — הפעימה-הבאה-תנסה-שוב"
              exit 1
            fi
          fi
